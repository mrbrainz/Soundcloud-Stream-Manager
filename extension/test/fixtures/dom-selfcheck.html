<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SCSM mock fixture — lib/dom.js self-check</title>
    <style>
      body { font-family: sans-serif; max-width: 640px; margin: 24px auto; }
      .fixture-note { color: #888; font-size: 12px; }
      #results { font-family: monospace; white-space: pre-wrap; }
      .pass { color: #1a7f37; }
      .fail { color: #cf222e; }
      ul.soundList__list { list-style: none; padding: 0; }
      li.soundList__item { border: 1px solid #ddd; padding: 6px; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <p class="fixture-note">
      Exercises <code>lib/dom.js</code>'s row-shape matching and its shared
      MutationObserver-driven scan loop. See
      <a href="../README.md">test/README.md</a>.
    </p>
    <div id="results">running…</div>

    <ul class="soundList__list" id="track-list">
      <li class="soundList__item"><a class="soundTitle__title" href="/testartist/old-repost-track">Old Repost Track</a></li>
      <li class="soundList__item"><a class="soundTitle__title" href="/testartist/recent-repost-track">Recent Repost Track</a></li>
      <li class="soundList__item"><a class="soundTitle__title" href="/testartist/long-mix">Long Mix Session</a></li>
    </ul>

    <!-- Live-verified (#50): soundcloud.com's /feed right-hand column
         ("New tracks"/"Artists you should follow"/"Recently played") wraps
         its own soundTitle__title-shaped anchors in a `.l-sidebar-right`
         layout container - those must never be treated as stream tracks. -->
    <div class="l-sidebar-right" id="sidebar">
      <ul class="soundBadgeList">
        <li class="soundBadgeList__item"><a class="soundTitle__title" href="/testartist/in-playlist-track">In Playlist Track</a></li>
      </ul>
    </div>

    <script src="/test/mocks/chrome-mock.js"></script>
    <script src="/test/mocks/data.js"></script>
    <script src="/test/mocks/sc-api-mock.js"></script>
    <script src="/content/mainWorldBridge.js"></script>
    <script src="/lib/settings.js"></script>
    <script src="/lib/auth.js"></script>
    <script src="/lib/api.js"></script>
    <script src="/lib/dom.js"></script>
    <script>
      (async function () {
        const out = document.getElementById('results');
        const lines = [];
        let failures = 0;

        function check(label, actual, expected) {
          const ok = JSON.stringify(actual) === JSON.stringify(expected);
          if (!ok) failures++;
          lines.push(
            `${ok ? 'PASS' : 'FAIL'} ${label}` +
              (ok ? '' : ` — expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`)
          );
        }

        function render() {
          out.textContent = lines.join('\n') + `\n\n${failures === 0 ? 'ALL PASSED' : failures + ' FAILED'}`;
          out.className = failures === 0 ? 'pass' : 'fail';
        }

        check('isRelevantFrame() in the top frame', window.SCSMDom.isRelevantFrame(), true);

        // ---- static row matching ----
        const anchors = window.SCSMDom.findTrackAnchors(document.body);
        check('findTrackAnchors finds only the 3 main-stream rows, not the sidebar one', anchors.length, 3);
        check(
          'permalinkPathFromHref resolves each anchor correctly',
          anchors.map((a) => window.SCSMDom.permalinkPathFromHref(a.getAttribute('href'))),
          ['/testartist/old-repost-track', '/testartist/recent-repost-track', '/testartist/long-mix']
        );

        // ---- sidebar exclusion (#50) ----
        const sidebarAnchor = document.querySelector('#sidebar a.soundTitle__title');
        check('isInSidebar is true for a .l-sidebar-right anchor', window.SCSMDom.isInSidebar(sidebarAnchor), true);
        check('isInSidebar is false for a main-stream anchor', window.SCSMDom.isInSidebar(anchors[0]), false);
        check(
          'findTrackAnchors(sidebar) directly returns nothing',
          window.SCSMDom.findTrackAnchors(document.getElementById('sidebar')).length,
          0
        );

        check(
          'findRowForAnchor walks up to the containing li.soundList__item',
          window.SCSMDom.findRowForAnchor(anchors[0]) === anchors[0].closest('li.soundList__item'),
          true
        );

        // ---- shared scan loop: initial deferred full scan ----
        const initialScans = [];
        window.SCSMDom.onScan((dirtyNodes) => initialScans.push(dirtyNodes));
        await new Promise((resolve) => setTimeout(resolve, 50)); // let the deferred initial rescan() fire
        check('onScan received the deferred initial full-page scan', initialScans.length >= 1, true);
        check('initial scan includes document.body', initialScans[0] && initialScans[0][0] === document.body, true);

        // ---- shared scan loop: MutationObserver picks up a newly-added row ----
        const mutationScans = [];
        window.SCSMDom.onScan((dirtyNodes) => mutationScans.push(dirtyNodes));
        const li = document.createElement('li');
        li.className = 'soundList__item';
        li.innerHTML = '<a class="soundTitle__title" href="/testartist/short-downloadable-track">Short Downloadable Track</a>';
        document.getElementById('track-list').appendChild(li);

        await new Promise((resolve) => setTimeout(resolve, 250)); // past the 150ms debounce
        const foundNewAnchor = mutationScans.some((nodes) => window.SCSMDom.findTrackAnchors(nodes[0] || null).length > 0 || nodes.includes(li));
        check('MutationObserver batch includes the newly-added row', foundNewAnchor, true);

        // ---- manual rescan() ----
        const rescanCalls = [];
        window.SCSMDom.onScan((dirtyNodes) => rescanCalls.push(dirtyNodes));
        window.SCSMDom.rescan();
        check('rescan() immediately re-notifies with document.body', rescanCalls[0] && rescanCalls[0][0] === document.body, true);

        // ---- page-type classification (#65) ----
        // pushState changes location.pathname without a real navigation,
        // so pageType() (which reads location.pathname live, not cached)
        // can be exercised against every live-verified real path shape
        // from a single fixture page.
        function checkPageType(path, expected) {
          history.pushState({}, '', path);
          check(`pageType() for "${path}"`, window.SCSMDom.pageType(), expected);
        }
        checkPageType('/feed', 'feed');
        checkPageType('/stream', 'feed');
        checkPageType('/discover', 'discover');
        checkPageType('/djbrainz', 'profile');
        checkPageType('/djbrainz/behold-garage-n-bass-episode', 'track');
        checkPageType('/djbrainz/sets/radio-shows', 'playlist');
        checkPageType('/you/library', null); // reserved root segment, not a real profile
        checkPageType('/notifications', null);
        checkPageType('/', null);
        checkPageType('/djbrainz/', 'profile'); // trailing slash doesn't change the classification

        check('isPageTypeEnabled() defaults true with no settings object', window.SCSMDom.isPageTypeEnabled(undefined), true);
        history.pushState({}, '', '/djbrainz');
        check(
          'isPageTypeEnabled() is true when the current type is on the list',
          window.SCSMDom.isPageTypeEnabled({ enabledPageTypes: ['profile', 'feed'] }),
          true
        );
        check(
          'isPageTypeEnabled() is false when the current type is NOT on the list',
          window.SCSMDom.isPageTypeEnabled({ enabledPageTypes: ['feed'] }),
          false
        );
        history.pushState({}, '', '/notifications'); // an unclassified page shape
        check(
          'isPageTypeEnabled() defaults true for an unclassified page shape, even with a narrow list',
          window.SCSMDom.isPageTypeEnabled({ enabledPageTypes: ['feed'] }),
          true
        );
        render();
        console.log('[SCSM selfcheck]', failures === 0 ? 'ALL PASSED' : failures + ' FAILED', lines);
      })();
    </script>
  </body>
</html>
